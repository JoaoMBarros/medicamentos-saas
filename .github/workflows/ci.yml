name: CI

on:
  push:
    branches:
      - 'feature*'
      - 'fix*'
  pull_request:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Run tests
        run: ./gradlew test
      - name: Verify minimum 85% JaCoCo coverage
        run: ./gradlew jacocoTestCoverageVerification
      - name: Run quality checks
        run: ./gradlew check
      - name: Build application
        run: ./gradlew build
